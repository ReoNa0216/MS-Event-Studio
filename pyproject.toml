[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-event-studio"
version = "0.6.1rc1"
description = "MS-only event extraction, review, and versioned export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flame-ms-core==0.1.1",
  "flame-feature-core==0.2.0",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow==24.0.0",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
packaging = [
  "pyinstaller==6.21.0",
  "Pillow>=10,<12",
  "pywebview==6.2.1",
]
qa = ["playwright>=1.49,<2"]

[project.scripts]
ms-event-studio = "ms_event_studio.cli:main"
ms-event-studio-gui = "ms_event_studio.web_desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ms_event_studio = [
  "assets/*.png",
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/icons/*.svg",
]
