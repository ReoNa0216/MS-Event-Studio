[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-event-studio"
version = "0.2.0.dev1"
description = "MS-only event extraction, review, and versioned export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<22",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
packaging = ["pyinstaller==6.21.0", "Pillow>=10,<12"]

[project.scripts]
ms-event-studio = "ms_event_studio.cli:main"
ms-event-studio-gui = "ms_event_studio.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ms_event_studio = ["assets/*.png"]
