name: Build and release desktop packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build without publishing
        required: true
        default: macos
        type: choice
        options:
          - macos
          - windows
          - all
      version:
        description: Artifact version for a manual candidate build
        required: true
        default: 0.6.0.dev1
        type: string
      publish_prerelease:
        description: Publish successful manual-build artifacts as a candidate prerelease
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    env:
      MS_EVENT_STUDIO_CONFIG_DIR: ${{ github.workspace }}/build/ci-runtime
    if: github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/windows/requirements-windows.txt
      - name: Resolve package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = $env:INPUT_VERSION
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test, build, and archive Windows x64
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.FLAME_COMPUTATION_READ_TOKEN || secrets.FLAME_MS_CORE_READ_TOKEN || github.token }}
        run: |
          $python = (Get-Command python).Source
          & "$PWD/desktop_bundle/build_windows.ps1" -PythonExe $python -Version "$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect runtime after a failed Windows build
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath build/ci-runtime/logs -File -ErrorAction SilentlyContinue | ForEach-Object { Get-Content -LiteralPath $_.FullName -Tail 100 }
          python -c "import subprocess,sys; subprocess.run([sys.executable,'-m','ms_event_studio.web_desktop','--check-runtime'],timeout=30,check=True)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms-event-studio-windows-diagnostics
          path: |
            build/ci-runtime/logs/*.log
            dist/windows/smoke_test.json
            dist/windows/build_manifest.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ms-event-studio-windows-x64
          path: |
            release/MS-Event-Studio-*-windows-x64.zip
            release/MS-Event-Studio-*-windows-x64.zip.sha256
          if-no-files-found: error

  build-macos-arm64:
    if: github.event_name == 'push' || inputs.platform == 'macos' || inputs.platform == 'all'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/macos/requirements-macos.txt
      - name: Resolve package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test, build, and archive macOS ARM64
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FLAME_COMPUTATION_READ_TOKEN || secrets.FLAME_MS_CORE_READ_TOKEN || github.token }}
        run: MS_EVENT_STUDIO_VERSION="$VERSION" bash desktop_bundle/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ms-event-studio-macos-arm64
          path: |
            release/MS-Event-Studio-*-macos-arm64.zip
            release/MS-Event-Studio-*-macos-arm64.zip.sha256
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push'
    needs:
      - build-windows
      - build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release archives
        shell: bash
        run: |
          for checksum_file in release-assets/*.zip.sha256; do
            (
              cd release-assets
              sha256sum --check "$(basename "$checksum_file")"
            )
          done
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.zip \
            release-assets/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "MS Event Studio $GITHUB_REF_NAME" \
            --notes-file README_RELEASE.md

  publish-prerelease:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_prerelease == true &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-macos-arm64.result == 'success' || needs.build-macos-arm64.result == 'skipped')
    needs:
      - build-windows
      - build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify candidate archives
        shell: bash
        run: |
          shopt -s nullglob
          checksum_files=(release-assets/*.zip.sha256)
          if [[ ${#checksum_files[@]} -eq 0 ]]; then
            echo "No candidate checksum files were downloaded" >&2
            exit 1
          fi
          for checksum_file in "${checksum_files[@]}"; do
            (
              cd release-assets
              sha256sum --check "$(basename "$checksum_file")"
            )
          done
      - name: Publish candidate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          candidate_tag="candidate-${CANDIDATE_VERSION}"
          gh release create "$candidate_tag" \
            release-assets/*.zip \
            release-assets/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MS Event Studio ${CANDIDATE_VERSION}" \
            --notes "Test candidate. GitHub Latest remains the stable release. Source workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
